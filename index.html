<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家庭记账</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --main: #ff8a3d;
    --main-dark: #f0741e;
    --main-light: #fff1e6;
    --text: #1a1a1a;
    --sub: #888;
    --light: #bbb;
    --border: #eee;
    --white: #fff;
    --red: #fa5151;
    --shadow: 0 2px 12px rgba(255,138,61,0.10);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #e0e0e0;
    color: var(--text);
    min-height: 100vh;
  }

  .app-frame {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    border: 3px solid var(--main);
    border-radius: 16px;
    overflow: hidden;
    background: #f5f5f5;
    box-shadow: 0 4px 24px rgba(255,138,61,0.18);
    position: relative;
    padding-bottom: 84px;
  }

  .header {
    background: linear-gradient(135deg, var(--main), var(--main-dark));
    color: #fff; padding: 16px 20px 18px;
    text-align: center; position: relative;
  }
  .header h1 { font-size: 21px; font-weight: 700; letter-spacing: 2px; }
  .header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 3px; letter-spacing: 1px; }

  .header-backup {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-size: 18px; cursor: pointer; opacity: 0.85; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }
  .header-backup:active { opacity: 0.5; }

  /* Tabs */
  .tabs { display: flex; background: var(--white); box-shadow: var(--shadow); }
  .tab {
    flex: 1; text-align: center; padding: 13px 0; font-size: 15px;
    color: var(--sub); font-weight: 500; cursor: pointer;
  }
  .tab.active { color: var(--main); font-weight: 700; }
  .tab.active::after {
    content: ''; display: block; width: 26px; height: 3px; background: var(--main);
    border-radius: 2px; margin: 3px auto 0;
  }

  .content { padding: 10px; }

  /* Date bar with 今天 return */
  .date-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--white); border-radius: 10px; padding: 7px 10px;
    margin-bottom: 10px; box-shadow: var(--shadow); position: relative;
  }
  .date-bar .arrow {
    background: var(--main-light); border: none; width: 34px; height: 34px;
    border-radius: 50%; font-size: 14px; color: var(--main); cursor: pointer; flex-shrink: 0;
  }
  .date-bar .arrow:active { opacity: 0.6; }
  .date-bar .mid { flex: 1; text-align: center; cursor: pointer; }
  .date-bar .date-text { font-size: 15px; font-weight: 600; }
  .date-bar .today-link { font-size: 11px; color: var(--main); display: block; margin-top: 1px; }
  .date-bar .today-link.on { color: var(--light); pointer-events: none; }

  /* Summary */
  .summary-card {
    background: var(--white); border-radius: 12px; padding: 14px;
    text-align: center; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .summary-card .amount { font-size: 28px; font-weight: 800; color: var(--main); line-height: 1.1; }
  .summary-card .meta { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .summary-card .meta b { color: var(--text); font-weight: 600; }

  /* Record item */
  .record-item {
    background: var(--white); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px;
  }
  .record-item .left { flex: 1; min-width: 0; cursor: pointer; }
  .record-item .note { font-size: 15px; font-weight: 600; }
  .record-item .note.blank { color: var(--light); font-weight: 400; }
  .record-item .record-date { font-size: 12px; color: var(--light); margin-top: 2px; }
  .record-item .amount-display { font-size: 16px; font-weight: 700; color: var(--main); white-space: nowrap; }
  .record-item .del-btn { border: none; background: none; color: #ccc; font-size: 17px;
    padding: 4px; cursor: pointer; }
  .record-item .del-btn:active { color: var(--red); }

  .empty { text-align: center; padding: 44px 20px; color: var(--light); }
  .empty .icon { font-size: 42px; margin-bottom: 8px; }
  .empty .text { font-size: 13px; }

  /* Bottom */
  .bottom-bar { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 14px; width: 100%; max-width: 400px; z-index: 100; }
  .bottom-bar .btn-primary {
    width: 100%; border: none; padding: 15px 0; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--main), var(--main-dark));
    box-shadow: 0 4px 14px rgba(255,138,61,0.35);
  }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 20px; width: 100%;
    max-width: 340px; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 18px; }
  .modal-group { margin-bottom: 14px; }
  .modal-group label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .modal-input { width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; font-size: 15px; outline: none; background: #fafafa; }
  .modal-input:focus { border-color: var(--main); background: #fff; }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btn { flex: 1; border: none; padding: 12px 0; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  .modal-btn.confirm { background: var(--main); color: #fff; }
  .modal-btn.cancel { background: #f0f0f0; color: var(--text); }
  .link-btn { display: inline-block; color: var(--main); font-size: 13px; margin-top: 6px;
    text-decoration: underline; cursor: pointer; }
  .hidden-file { display: none; }

  .toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.78); color: #fff; padding: 12px 26px;
    border-radius: 12px; font-size: 14px; z-index: 500; display: none;
    max-width: 80%; text-align: center; }
  .toast.show { display: block; }
</style>
</head>
<body>

<div class="app-frame">

  <div class="header">
    <div class="header-backup" onclick="openBackupModal()">&#9881;</div>
    <h1>家庭记账</h1>
    <div class="subtitle">日常买菜吃饭</div>
  </div>

  <!-- Tabs: 日 / 月 / 年 -->
  <div class="tabs">
    <div class="tab active" data-tab="day">日</div>
    <div class="tab" data-tab="month">月</div>
    <div class="tab" data-tab="year">年</div>
  </div>

  <div class="content" id="content"></div>

  <div class="bottom-bar">
    <button class="btn-primary" onclick="openRecordModal()">记一笔</button>
  </div>

</div>

<!-- Record Modal -->
<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <div class="modal-title" id="recordModalTitle">记一笔</div>
    <div class="modal-group">
      <label>金额（元）</label>
      <input type="number" class="modal-input" id="recordAmount" placeholder="0.00" step="0.01" inputmode="decimal">
    </div>
    <div class="modal-group">
      <label>备注（可不填）</label>
      <input type="text" class="modal-input" id="recordNote" placeholder="如：买菜、午饭…">
    </div>
    <div class="modal-group">
      <label>日期</label>
      <input type="date" class="modal-input" id="recordDate">
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal('recordModal')">取消</button>
      <button class="modal-btn confirm" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<!-- Backup Modal -->
<div class="modal-overlay" id="backupModal">
  <div class="modal">
    <div class="modal-title">数据备份与同步</div>
    <div style="text-align:center;font-size:13px;color:var(--sub);margin-bottom:12px;">
      数据默认只存在本机<br>建议开启云端同步，换手机/清缓存也不丢
    </div>

    <div style="font-size:13px;font-weight:600;color:var(--text);margin:4px 0 8px;">&#9729; 云端同步（推荐）</div>
    <div class="modal-btns">
      <button class="modal-btn confirm" onclick="cloudUpload()">上传到云端</button>
      <button class="modal-btn" style="background:#f0f0f0;color:var(--text)" onclick="cloudDownload()">从云端拉取</button>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--sub);margin-top:8px;" id="cloudStatus"></div>
    <div style="text-align:center;"><span class="link-btn" onclick="showCloudConfig()">云端配置（填账号）</span></div>

    <div style="height:1px;background:#eee;margin:14px 0;"></div>
    <div style="font-size:13px;font-weight:600;color:var(--text);margin:0 0 8px;">&#128229; 本机备份文件</div>
    <div class="modal-btns">
      <button class="modal-btn confirm" onclick="exportData()">导出文件</button>
      <button class="modal-btn cancel" style="background:#f0f0f0" onclick="document.getElementById('importFile').click()">导入文件</button>
    </div>

    <div class="modal-btns" style="margin-top:12px">
      <button class="modal-btn cancel" onclick="closeModal('backupModal')">关闭</button>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept=".json" onchange="importData(this)" class="hidden-file">

<!-- Cloud Config Modal -->
<div class="modal-overlay" id="cloudConfigModal">
  <div class="modal">
    <div class="modal-title">云端同步配置</div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:12px;">填一次即可。数据会上传到你的 GitHub 云端，永久保存。</div>
    <div class="modal-group"><label>GitHub Token</label><input type="password" class="modal-input" id="cfgToken"></div>
    <div class="modal-group"><label>用户名</label><input type="text" class="modal-input" id="cfgOwner"></div>
    <div class="modal-group"><label>仓库名</label><input type="text" class="modal-input" id="cfgRepo"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal('cloudConfigModal')">取消</button>
      <button class="modal-btn confirm" onclick="saveCloudConfig()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var STORE_KEY = 'simple_ledger_v2';

  var appData = loadData();
  saveData(appData);

  var currentTab = 'day';
  var currentDate = new Date();
  var editingId = null;

  function loadData() {
    try {
      var d = JSON.parse(localStorage.getItem(STORE_KEY));
      return (d && d.records) ? d : { records: [] };
    } catch(e) { return { records: [] }; }
  }
  function saveData(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

  // helpers
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function fmtMoney(n) { return (n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dt(s) { return new Date(String(s).replace(' ', 'T')); }
  function isToday(d) { var n = new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }
  function isThisMonth(d) { var n = new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); }
  function isThisYear(d) { return d.getFullYear() === new Date().getFullYear(); }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  window.closeModal = function(id) { document.getElementById(id).classList.remove('show'); };
  document.querySelectorAll('.modal-overlay').forEach(function(o){
    o.addEventListener('click', function(e){ if(e.target===o) o.classList.remove('show'); });
  });

  // 保存（新增或修改）
  window.saveRecord = function() {
    var amount = parseFloat(document.getElementById('recordAmount').value);
    var note = document.getElementById('recordNote').value.trim();
    var date = document.getElementById('recordDate').value;
    if (isNaN(amount) || amount <= 0) { showToast('请输入金额'); return; }
    if (!date) { showToast('请选择日期'); return; }
    if (editingId) {
      var rec = appData.records.filter(function(r){ return r.id === editingId; })[0];
      if (rec) { rec.amount = amount; rec.note = note; rec.date = date; }
      editingId = null; showToast('已修改');
    } else {
      appData.records.push({ id: Date.now().toString()+Math.random().toString(36).slice(2,6),
        amount: amount, note: note, date: date, createdAt: Date.now() });
      showToast('已记录');
    }
    saveData(appData);
    closeModal('recordModal');
    render();
  };

  window.openRecordModal = function() {
    editingId = null;
    document.getElementById('recordModalTitle').textContent = '记一笔';
    document.getElementById('recordAmount').value = '';
    document.getElementById('recordNote').value = '';
    document.getElementById('recordDate').value = fmtDate(new Date());
    document.getElementById('recordModal').classList.add('show');
  };

  window.editRecord = function(id) {
    var rec = appData.records.filter(function(r){ return r.id === id; })[0];
    if (!rec) return;
    editingId = id;
    document.getElementById('recordModalTitle').textContent = '修改';
    document.getElementById('recordAmount').value = rec.amount;
    document.getElementById('recordNote').value = rec.note || '';
    document.getElementById('recordDate').value = rec.date;
    document.getElementById('recordModal').classList.add('show');
  };

  window.deleteRecord = function(id) {
    var rec = appData.records.filter(function(r){ return r.id === id; })[0];
    if (!rec) return;
    if (!confirm('删除 ' + fmtMoney(rec.amount) + (rec.note ? '（'+rec.note+'）' : '') + ' 这笔？')) return;
    appData.records = appData.records.filter(function(r){ return r.id !== id; });
    saveData(appData); showToast('已删除'); render();
  };

  // ===== 渲染 =====
  function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function itemHTML(r) {
    var note = r.note ? esc(r.note) : '未填备注';
    var cls = r.note ? '' : ' blank';
    var showDate = (currentTab === 'year') ? (r.date.slice(0,7).replace('-','年')+'月') :
                   (currentTab === 'month' ? r.date.slice(5).replace('-','月')+'日' : '');
    return '<div class="record-item">' +
      '<div class="left" onclick="editRecord(\''+r.id+'\')">' +
      '<div class="note'+cls+'">'+note+'</div>' +
      (showDate ? '<div class="record-date">'+showDate+'</div>' : '') +
      '</div>' +
      '<div class="amount-display">'+fmtMoney(r.amount)+'</div>' +
      '<button class="del-btn" onclick="deleteRecord(\''+r.id+'\')">&times;</button></div>';
  }

  function render() {
    var c = document.getElementById('content');
    if (currentTab === 'day') c.innerHTML = renderList('day');
    else if (currentTab === 'month') c.innerHTML = renderList('month');
    else c.innerHTML = renderList('year');
  }

  // 通用列表渲染：label 为周期标签，isCur 判断是否当前周期，getRecs 取记录
  function renderList(tab) {
    var recs, total, label, isCur, unit;
    if (tab === 'day') {
      recs = appData.records.filter(function(r){ return fmtDate(dt(r.date)) === fmtDate(currentDate); });
      label = fmtDate(currentDate); isCur = isToday(currentDate);
      unit = '天';
    } else if (tab === 'month') {
      recs = appData.records.filter(function(r){ var d=dt(r.date); return d.getFullYear()===currentDate.getFullYear() && d.getMonth()===currentDate.getMonth(); });
      label = currentDate.getFullYear() + '年' + (currentDate.getMonth()+1) + '月';
      isCur = isThisMonth(currentDate); unit = '月';
    } else {
      recs = appData.records.filter(function(r){ return dt(r.date).getFullYear() === currentDate.getFullYear(); });
      label = currentDate.getFullYear() + '年'; isCur = isThisYear(currentDate); unit = '年';
    }
    recs.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    total = recs.reduce(function(s,r){ return s + r.amount; }, 0);

    var html = '';
    html += '<div class="date-bar">';
    html += '<button class="arrow" onclick="shift(-1)">&#9664;</button>';
    html += '<div class="mid" onclick="goToday()">';
    html += '<div class="date-text">' + label + '</div>';
    html += '<div class="today-link' + (isCur ? ' on' : '') + '">' + (isCur ? '当前' + unit : '&#8634; 返回今天') + '</div>';
    html += '</div>';
    html += '<button class="arrow" onclick="shift(1)">&#9654;</button>';
    html += '</div>';

    html += '<div class="summary-card"><div class="amount">' + fmtMoney(total) + '</div>' +
      '<div class="meta">共 <b>' + recs.length + '</b> 笔</div></div>';

    if (recs.length === 0) {
      html += '<div class="empty"><div class="icon">&#128184;</div><div class="text">这个' + unit + '没有记录</div></div>';
    } else {
      recs.forEach(function(r){ html += itemHTML(r); });
    }
    return html;
  }

  // ===== 翻页 & 返回今天 =====
  window.shift = function(n) {
    if (currentTab === 'day') currentDate.setDate(currentDate.getDate() + n);
    else if (currentTab === 'month') currentDate.setMonth(currentDate.getMonth() + n);
    else currentDate.setFullYear(currentDate.getFullYear() + n);
    render();
  };
  window.goToday = function() { currentDate = new Date(); render(); };

  // ===== Tabs =====
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      currentDate = new Date();
      render();
    });
  });

  // ===== Backup =====
  window.openBackupModal = function() {
    updateCloudStatus();
    document.getElementById('backupModal').classList.add('show');
  };
  window.exportData = function() {
    var payload = { version: 1, exportedAt: new Date().toISOString(), records: appData.records };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '家庭记账备份_' + fmtDate(new Date()) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url); showToast('备份已下载');
  };
  window.importData = function(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var p = JSON.parse(e.target.result);
        var recs = Array.isArray(p.records) ? p.records : [];
        recs = recs.filter(function(r){ return r && typeof r.amount === 'number' && r.date; })
          .map(function(r){
            return { id: r.id || Date.now().toString()+Math.random().toString(36).slice(2,6),
              amount: r.amount, note: r.note || '', date: r.date, createdAt: r.createdAt || Date.now() };
          });
        appData.records = recs;
        saveData(appData);
        showToast('恢复成功，' + appData.records.length + ' 笔');
        render();
      } catch(err) { showToast('文件格式不正确'); }
      input.value = '';
    };
    reader.readAsText(file);
  };

  // ===== Cloud sync (GitHub) =====
  var CFG_KEY = 'simple_ledger_cloud';
  function getCloudCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch(e) { return {}; } }
  function saveCloudCfgLocal(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
  function getApiUrl() {
    var cfg = getCloudCfg();
    return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/ledger_data.json';
  }
  function updateCloudStatus() {
    var cfg = getCloudCfg();
    var st = document.getElementById('cloudStatus');
    if (cfg.owner && cfg.repo) {
      st.innerHTML = (cfg.lastSync ? '上次同步：' + new Date(cfg.lastSync).toLocaleString('zh-CN')
        : '已配置，点「上传到云端」即可保存');
    } else {
      st.textContent = '尚未配置';
    }
  }
  window.showCloudConfig = function() {
    var cfg = getCloudCfg();
    document.getElementById('cfgToken').value = cfg.token || '';
    document.getElementById('cfgOwner').value = cfg.owner || '';
    document.getElementById('cfgRepo').value = cfg.repo || '';
    document.getElementById('cloudConfigModal').classList.add('show');
  };
  window.saveCloudConfig = function() {
    var cfg = {
      token: document.getElementById('cfgToken').value.trim(),
      owner: document.getElementById('cfgOwner').value.trim(),
      repo: document.getElementById('cfgRepo').value.trim(),
      lastSync: getCloudCfg().lastSync || ''
    };
    if (!cfg.token || !cfg.owner || !cfg.repo) { showToast('请填写完整'); return; }
    saveCloudCfgLocal(cfg);
    closeModal('cloudConfigModal');
    updateCloudStatus();
    showToast('配置已保存');
  };
  function cloudPut(cb) {
    var cfg = getCloudCfg();
    if (!cfg.token || !cfg.owner || !cfg.repo) { showToast('请先配置云端账号'); showCloudConfig(); return; }
    var payload = JSON.stringify({ version: 1, syncedAt: new Date().toISOString(), records: appData.records });
    var b64 = btoa(unescape(encodeURIComponent(payload)));
    var url = getApiUrl();
    var bodyData = { message: '记账同步 ' + new Date().toLocaleString('zh-CN'), content: b64, branch: 'main' };
    // 先查已有文件拿 sha
    fetch(url, { headers: { 'Authorization': 'token ' + cfg.token } })
      .then(function(r) { return r.ok ? r.json().then(function(d){ bodyData.sha = d.sha; return true; }) : true; })
      .then(function() {
        return fetch(url, { method: 'PUT',
          headers: { 'Authorization': 'token ' + cfg.token, 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData) });
      })
      .then(function(r) {
        if (r.ok) {
          cfg.lastSync = Date.now(); saveCloudCfgLocal(cfg);
          updateCloudStatus();
          if (cb) cb(true);
        } else { if (cb) cb(false); }
      })
      .catch(function(){ if (cb) cb(false); });
  }
  window.cloudUpload = function() {
    showToast('上传中…');
    cloudPut(function(ok){ showToast(ok ? '已上传到云端' : '上传失败，请检查配置'); });
  };
  window.cloudDownload = function() {
    var cfg = getCloudCfg();
    if (!cfg.token || !cfg.owner || !cfg.repo) { showToast('请先配置云端账号'); showCloudConfig(); return; }
    showToast('同步中…');
    fetch(getApiUrl(), { headers: { 'Authorization': 'token ' + cfg.token } })
      .then(function(r) {
        if (!r.ok) { showToast('云端暂无数据'); return null; }
        return r.json();
      })
      .then(function(d) {
        if (!d || !d.content) return;
        var payload = JSON.parse(decodeURIComponent(escape(atob(d.content))));
        var recs = Array.isArray(payload.records) ? payload.records : [];
        if (recs.length || !appData.records.length) {
          appData.records = recs;
          saveData(appData);
          cfg.lastSync = Date.now(); saveCloudCfgLocal(cfg);
          updateCloudStatus();
          showToast('已从云端同步，' + appData.records.length + ' 笔');
          render();
        } else {
          showToast('云端是空的，本地有数据');
        }
      })
      .catch(function(){ showToast('网络错误'); });
  };

  // init
  render();
})();
</script>
</body>
</html>
